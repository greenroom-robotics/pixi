name: GR Release

# Cuts a `pixi-gr@<version>` fork release, bumped from the conventional commits
# since the last `pixi-gr@` tag unless a version is given.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release this X.Y.Z instead of bumping from commits (e.g. to sync with upstream).
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: gr-release

jobs:
  release:
    # A fork's dispatch would build both arches before failing on a `gh release
    # create` its token can't authorise.
    if: github.repository == 'greenroom-robotics/pixi'
    runs-on: 16vcpu-ubuntu-2404
    steps:
      # Full history: the script refuses a tag that already exists at another
      # commit, which it can only check with the tags present.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          build-warnings: allow

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-zigbuild@0.23.4,git-cliff@2.14.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # cargo-zigbuild falls back to `python3 -m ziglang` when no zig binary is
      # on PATH
      - run: pip install ziglang==0.16.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        id: release
        run: python3 scripts/release_gr.py ${VERSION:+--version "$VERSION"}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push images
        run: |
          for entry in bookworm=debian:bookworm-slim trixie=debian:trixie-slim resolute=ubuntu:26.04; do
            base=${entry%%=*}
            docker buildx build staging --file docker/Dockerfile --push \
              --platform linux/amd64,linux/arm64 \
              --build-arg BASE_IMAGE="${entry#*=}" \
              --tag "$IMAGE:$VERSION-$base" --tag "$IMAGE:$base"
          done
        env:
          IMAGE: ghcr.io/greenroom-robotics/pixi
          VERSION: ${{ steps.release.outputs.version }}
